if not config.enable_rock_driver_pr_e2e_test or config.no_AMD_GPU:
  config.unsupported = True

if not config.arch.startswith("gfx12"):
  config.excludes.add('mixr-tadd-tadd-quant-dot.mlir')

# gfx1250 doesn't support AtomicLoadAnd needed for INT4 sub-byte store emulation
if config.arch.startswith("gfx1250"):
  config.excludes.update([
    'mixr-dot-int4-f16-1645.mlir',
    'mixr-dot-int4-f16.mlir',
    'mixr-dot-uint4-f16.mlir',
    'mixr-dot-uint4-f16-uint32.mlir'
  ])
